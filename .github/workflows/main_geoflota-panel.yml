# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - geoflota-panel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install and build
        run: |
          npm install
          npm run build

      - name: Armar paquete standalone (sin node_modules completos)
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Diagnostico -- confirmar que el build quedo completo antes de subir
        run: |
          echo "--- .next/standalone ---"
          ls -la .next/standalone
          echo "--- .next/standalone/.next ---"
          ls -la .next/standalone/.next
          echo "--- BUILD_ID ---"
          cat .next/standalone/.next/BUILD_ID || echo "BUILD_ID NO EXISTE"

      - name: Armar el zip a mano (rutas con / para que funcione en Linux)
        run: |
          python3 -c "
          import zipfile, os
          src = '.next/standalone'
          with zipfile.ZipFile('deploy.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk(src):
                  for f in files:
                      full = os.path.join(root, f)
                      rel = os.path.relpath(full, src).replace(os.sep, '/')
                      zf.write(full, rel)
          "
          echo "--- contenido del zip ---"
          unzip -l deploy.zip | grep -E "server.js|BUILD_ID"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Diagnostico -- confirmar que el zip llego completo
        run: |
          ls -la deploy.zip
          unzip -l deploy.zip | grep -E "server.js|BUILD_ID"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'geoflota-panel'
          slot-name: 'Production'
          package: deploy.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E2CC1867A30040EBB802A1F85EBABF9D }}
